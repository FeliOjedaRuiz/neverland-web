name: CI — Tests (Frontend + Backend)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Verificación (Tests & iPhone Compatibility)
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            api/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Run Frontend Tests (Vitest)
        working-directory: web
        run: npm run test:run

      - name: Install Backend Dependencies
        working-directory: api
        run: npm install --legacy-peer-deps

      - name: Run Backend Tests (Jest)
        working-directory: api
        run: npm test

# Deploy handled automatically by Vercel (Frontend) and Render (Backend) on push to main.
# No manual deploy step needed.
